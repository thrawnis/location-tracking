{% extends "base.html" %}
{% block title %}Two-factor code – Waypoint{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="px-6 py-5 border-b border-slate-100">
      <h1 class="text-xl font-bold text-slate-900">Enter your code</h1>
      <p class="text-sm text-slate-500 mt-1">Open your authenticator app and enter the current 6-digit code.</p>
    </div>
    <div class="px-6 py-5 space-y-3">
      {% if error %}
      <p class="text-red-500 text-xs">{{ error }}</p>
      {% endif %}
      <form method="post" class="space-y-3">
        {% csrf_token %}
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="6" placeholder="123456" autofocus
               class="block w-full text-center tracking-[0.4em] text-lg font-mono border border-slate-200
                      rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
        <button type="submit"
                class="w-full bg-brand hover:bg-brand-dark text-white font-semibold px-5 py-2.5 rounded-lg transition-colors">
          Verify
        </button>
      </form>
    </div>
    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50">
      <a href="{% url 'login' %}" class="text-sm text-slate-500 hover:text-slate-700">← Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}

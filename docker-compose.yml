services:
  db:
    image: postgres:16-alpine
    container_name: waypoint-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # -d avoids "database <user> does not exist" FATALs in the log; pg_isready
      # was defaulting the DB name to the user name (tracker), which isn't a real DB.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-waypoint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: waypoint:latest
    build: .
    container_name: waypoint
    ports:
      - "3007:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-waypoint}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-False}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_CREDENTIALS_FILE: ${GCP_CREDENTIALS_FILE:-}
      GCP_BILLING_BQ_TABLE: ${GCP_BILLING_BQ_TABLE:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-True}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Waypoint <no-reply@example.com>}
      TERMS_VERSION: ${TERMS_VERSION:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data/media:/app/data/media
      - ./data/staticfiles:/app/data/staticfiles
      # For the admin "Maps usage" page: mount a read-only service-account key.
      # Then set GCP_CREDENTIALS_FILE=/app/data/gcp-credentials.json in .env
      # - ./data/gcp-credentials.json:/app/data/gcp-credentials.json:ro
